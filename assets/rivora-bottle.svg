    <path d="M88 166h198" stroke="#2f0d17" stroke-opacity=".55" stroke-width="2"/>

    <text x="174" y="127" text-anchor="middle" fill="#fff4e7" font-family="Georgia,serif" font-size="25" letter-spacing="2">R</text>
    <text x="180" y="141" text-anchor="middle" fill="#f7e9dd" font-family="Arial,sans-serif" font-size="7" letter-spacing="3">TWIST TO CHOOSE</text>

    <rect x="140" y="151" width="37" height="30" rx="9" fill="url(#lemon)" stroke="#fff0cf" stroke-width="2"/>
    <rect x="183" y="151" width="37" height="30" rx="9" fill="url(#berry)" stroke="#ffe2d8" stroke-width="2"/>
    <path d="M146 157h21" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <path d="M189 157h21" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>

    <path d="M112 197h136l25 32q15 17 15 39v260q0 47-48 52H120q-48-5-48-52V268q0-22 15-39l25-32Z" fill="url(#glass)" stroke="#fffdf9" stroke-width="5"/>
    <g clip-path="url(#bottle-body)">
