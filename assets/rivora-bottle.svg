      <path d="M108 240v92" stroke="#fff" stroke-opacity=".68" stroke-width="3" stroke-linecap="round"/>
      <path d="M274 259v273" stroke="#fff" stroke-opacity=".54" stroke-width="7" stroke-linecap="round"/>
      <text x="180" y="407" text-anchor="middle" fill="#672c3b" font-family="Georgia,serif" font-size="20" letter-spacing="4">RIVORA</text>
      <text x="180" y="426" text-anchor="middle" fill="#946056" font-family="Arial,sans-serif" font-size="6" letter-spacing="2">TWIST · CUSTOMISE · SIP</text>
      <path d="M180 446c-5 9-12 15-12 22a12 12 0 0 0 24 0c0-7-7-13-12-22Z" fill="#c87d6a" opacity=".7"/>
      <path d="M176 470q1 5 6 7" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M82 558q98 17 196 0" fill="none" stroke="#fff" stroke-opacity=".87" stroke-width="4"/>
    <path d="M111 582q69 15 138 0" fill="none" stroke="#cbb7aa" stroke-opacity=".45" stroke-width="3"/>
