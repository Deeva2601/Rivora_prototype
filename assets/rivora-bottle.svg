<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title">
  <title id="title">RIVORA reusable bottle with a dual-flavour twist cap</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a66a68"/>
      <stop offset=".23" stop-color="#702b3a"/>
      <stop offset=".6" stop-color="#511626"/>
      <stop offset="1" stop-color="#37101c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".08" stop-color="#fff" stop-opacity=".54"/>
      <stop offset=".27" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".51" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".78" stop-color="#efd9cc" stop-opacity=".2"/>
      <stop offset=".95" stop-color="#fff" stop-opacity=".74"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efbc75" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#ffd1a2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#df7580" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="lemon" x1="0" y1="0" x2="1" y2="1">
