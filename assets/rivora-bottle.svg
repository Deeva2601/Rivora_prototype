    <path d="M274 72h35q15 0 15 15v54q0 16-15 16h-25" fill="none" stroke="#541b2b" stroke-width="12" stroke-linecap="round"/>
    <path d="M282 80h22q9 0 9 10v43q0 9-9 9h-20" fill="none" stroke="#b77968" stroke-width="4" stroke-linecap="round"/>

    <path d="M112 194h136l20 29H92Z" fill="#e6d8ce" stroke="#bda99c" stroke-width="2"/>
    <path d="M129 178h102v25H129z" fill="url(#glass)" stroke="#f8f3ee" stroke-width="3"/>
    <path d="M121 185h118v9H121z" fill="#83525a" opacity=".3"/>

    <path d="M72 102q0-38 41-38h134q41 0 41 38v66q0 31-31 31H103q-31 0-31-31z" fill="url(#cap)" stroke="#401523" stroke-width="3"/>
    <path d="M83 100q0-25 30-25h135q31 0 31 25v10H83z" fill="#fff" opacity=".1"/>
    <path d="M83 145h205v22q0 25-27 25H110q-27 0-27-25z" fill="#531b2a"/>
