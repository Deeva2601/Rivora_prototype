    <clipPath id="bottle-body">
      <path d="M112 197h136l25 32q15 17 15 39v260q0 47-48 52H120q-48-5-48-52V268q0-22 15-39l25-32Z"/>
    </clipPath>
    <filter id="shadow" x="-.3" y="-.15" width="1.7" height="1.5">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#482b2d" flood-opacity=".2"/>
    </filter>
  </defs>

